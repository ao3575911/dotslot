# pre-commit hooks (https://pre-commit.com). Use from another repo:
#   - repo: https://github.com/ao3575911/dotslot
#     rev: v0.8.0
#     hooks: [{ id: dotslot-check }, { id: dotslot-lint }]
- id: dotslot-check
  name: dotslot fill-safe check
  description: Staged files may differ from HEAD only inside <./…> slots, and every slot must be well-formed.
  entry: dotslot check --git-base HEAD
  language: python
  types: [text]
- id: dotslot-lint
  name: dotslot lint (well-formed slots, fit at 100 cells)
  description: Every slot is well-formed and no slot line is wider than 100 cells.
  entry: dotslot check --fit 100
  language: python
  types: [text]
