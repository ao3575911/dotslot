name: release
# Run from the Actions tab (or `gh workflow run release`) on main after the version-bump PR is merged.
# CI creates and GPG-signs the tag; the signing key lives only in the RELEASE_GPG_KEY secret.
# The pypi job runs after the release job, or on its own when a v* tag is pushed.
# (A tag pushed by the release job's GITHUB_TOKEN does not trigger workflows, hence the `needs` chain.)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA on main to release (default: main HEAD)"
        required: false
        default: ""
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs: { tag: "${{ steps.ver.outputs.tag }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref || github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - name: Release from main only; tag = pyproject version
        id: ver
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor HEAD origin/main
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          grep -q "__version__ = \"$v\"" dotslot/__init__.py
          echo "TAG=v$v" >> "$GITHUB_ENV"; echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          git config --global user.name ci; git config --global user.email ci@example.invalid
          pip install -e ".[test]" build && python -m pytest -q tests
      - name: Create and push the GPG-signed tag
        env: { GPG_KEY: "${{ secrets.RELEASE_GPG_KEY }}" }
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            # Tag already pushed (see RELEASING.md): reuse it only if CI-signed and on this commit.
            git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
            gpg --batch --quiet --import .github/release-signing-key.asc; git tag -v "$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          git -c user.name=ao3575911 -c user.email=280728713+ao3575911@users.noreply.github.com \
              -c user.signingkey="$fpr" tag -s "$TAG" -m "$TAG"
          rm -rf "$GNUPGHOME"
          gpg --batch --quiet --import .github/release-signing-key.asc; git tag -v "$TAG"
          if ! git push origin "refs/tags/$TAG"; then
            # GITHUB_TOKEN cannot push a ref whose workflow files differ from main's.
            echo "TAG_OBJECT_BASE64=$(git cat-file tag "$TAG" | base64 -w0)"
            echo "::error::Tag push blocked. Push the signed tag object above with a workflow-scoped token (RELEASING.md), then re-run."
            exit 1
          fi
      - name: Build and checksum
        run: |
          python -m build
          cd dist && sha256sum * > ../SHA256SUMS && cd .. && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*" }
      - name: GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* SHA256SUMS --title "$TAG" --notes-file notes.md --verify-tag
  pypi:
    needs: release
    if: always() && (needs.release.result == 'success' || (github.event_name == 'push' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/project/dotslot/" }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.release.outputs.tag || github.ref }}" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - name: Build sdist and wheel from the tag
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$(git describe --tags --exact-match)" = "v$v"
          pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: { skip-existing: true }
