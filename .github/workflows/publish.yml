name: publish
# Manual publishing of the npm CLI and the VS Code extension (Open VSX only). Run from the Actions tab after a release tag exists.
#   npm:    trusted publishing (OIDC, no token) once configured on npmjs.com; falls back to the NPM_TOKEN secret.
#           Publishes with provenance.
#   vscode: OVSX_PAT secret (Open VSX). The Visual Studio Marketplace is not used.
on:
  workflow_dispatch:
    inputs:
      target: { description: "npm, vscode or both", required: true, default: npm, type: choice, options: [npm, vscode, both] }
      tag: { description: "Release tag to publish, e.g. v0.8.1", required: true }
permissions: { contents: read }
jobs:
  npm:
    if: inputs.target == 'npm' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: npm
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: npm } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag }}" }
      - name: Version must match the tag
        run: test "v$(node -p 'require("./package.json").version')" = "${{ inputs.tag }}"
      - run: npm ci && npm test
      - name: Publish
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > ~/.npmrc; fi
          npm publish --provenance --access public
  vscode:
    if: inputs.target == 'vscode' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: vscode
    defaults: { run: { working-directory: vscode } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.tag }}" }
      - name: Version must match the tag
        run: test "v$(node -p 'require("./package.json").version')" = "${{ inputs.tag }}"
      - run: npm ci && npm test && npx vsce package --no-dependencies -o dotslot.vsix
      - name: Open VSX
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
        run: |
          npx --yes ovsx@0.10 create-namespace ao3575911 || true
          npx --yes ovsx@0.10 publish dotslot.vsix
