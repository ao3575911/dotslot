[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotslot"
version = "0.2.0"
description = "Let agents fill the blanks in a file, and prove they touched nothing else."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["wcwidth>=0.2.6"]
keywords = ["templates", "fixed-width", "ai-agents", "mcp", "pre-commit", "lint"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Topic :: Software Development :: Quality Assurance"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dotslot = "dotslot.cli:main"
dotslot-mcp = "dotslot.mcp:main"

[project.urls]
Homepage = "https://github.com/ao3575911/dotslot"
Changelog = "https://github.com/ao3575911/dotslot/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["dotslot"]
